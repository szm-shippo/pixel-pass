name: Repository Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "README.md"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "::error file=$path::Required file is missing or empty."
              exit 1
            fi
          done

      - name: Validate Markdown headings
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            if ! grep -qE '^# ' "$file"; then
              echo "::error file=$file::Markdown file must include a top-level heading."
              exit 1
            fi
          done < <(find . -path ./.git -prune -o -path ./.github/prompts -prune -o -name '*.md' -type f -print)
